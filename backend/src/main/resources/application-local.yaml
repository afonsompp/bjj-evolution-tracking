server:
  port: 8080
  address: 0.0.0.0
spring:
  application:
    name: tracking
  datasource:
    url: jdbc:postgresql://localhost:5432/jiujitsu_db
    username: jiujitsu_user
    password: jiujitsu_password
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
      jdbc:
        time_zone: UTC
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  # Local keeps Hibernate ddl-auto:update for fast dev iteration; Flyway is off here
  # (it owns the schema in prod). To exercise migrations locally, drop the DB and set
  # ddl-auto:validate + flyway.enabled:true.
  flyway:
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://tpltengabmlhpkhdmqbm.supabase.co/auth/v1
          audiences: authenticated

# Supabase Storage. Secrets come from env vars (leave unset to disable uploads).
# Set STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY (and the others below if needed) in
# your local shell or .env — see application.yaml for the full list.
storage:
  endpoint: ${STORAGE_ENDPOINT:}
  public-url-base: ${STORAGE_PUBLIC_URL_BASE:}
  region: ${STORAGE_REGION:sa-east-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:avatars}
  signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:3600}

# Notifications. The Resend api-key comes from RESEND_API_KEY (leave unset to
# boot with the no-op email sender). from-email onboarding@resend.dev only
# delivers to the Resend account's own email until a domain is verified.
notification:
  resend:
    enabled: ${RESEND_ENABLED:false}
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:onboarding@resend.dev}
    from-name: ${RESEND_FROM_NAME:BJJ Evolution (local)}
  class-reminder:
    enabled: true
    hours-before: 12
    fixed-delay-ms: 300000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    displayRequestDuration: true
