spring:
  application:
    name: tracking
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # Flyway owns the schema (db/migration/V*.sql); Hibernate only validates
      # that the entities match what the migrations produced.
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://tpltengabmlhpkhdmqbm.supabase.co/auth/v1
          audiences: authenticated

# CORS — origins allowed to call the API (comma-separated). Dev default is the
# Vite dev server; in prod set CORS_ALLOWED_ORIGINS to the frontend URL(s),
# e.g. https://your-frontend.onrender.com
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# File storage (Supabase Storage via S3-compatible API). Leave STORAGE_ENDPOINT
# unset to disable uploads (the app boots with a DisabledFileStorage fallback).
#   STORAGE_ENDPOINT        https://<project-ref>.supabase.co/storage/v1/s3
#   STORAGE_PUBLIC_URL_BASE https://<project-ref>.supabase.co/storage/v1/object/public
#   STORAGE_REGION          project region (e.g. sa-east-1)
#   STORAGE_ACCESS_KEY / STORAGE_SECRET_KEY   from Storage → S3 connection
#   STORAGE_BUCKET          a public bucket you created (e.g. avatars)
storage:
  endpoint: ${STORAGE_ENDPOINT:}
  public-url-base: ${STORAGE_PUBLIC_URL_BASE:}
  region: ${STORAGE_REGION:us-east-1}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  bucket: ${STORAGE_BUCKET:avatars}
  signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:3600}

# Notifications. Email goes through Resend (https://resend.com). Leave
# RESEND_ENABLED=false (default) to boot with a DisabledEmailSender that logs
# messages instead of sending. For testing without a verified domain, set
# RESEND_FROM_EMAIL=onboarding@resend.dev (delivers only to the account owner).
notification:
  resend:
    enabled: ${RESEND_ENABLED:false}
    api-key: ${RESEND_API_KEY:}
    from-email: ${RESEND_FROM_EMAIL:noreply@bjjevolution.com}
    from-name: ${RESEND_FROM_NAME:BJJ Evolution}
  class-reminder:
    enabled: ${CLASS_REMINDER_ENABLED:true}
    hours-before: ${CLASS_REMINDER_HOURS:12}
    fixed-delay-ms: ${CLASS_REMINDER_DELAY_MS:300000}

rate-limit:
  enabled: true
  rules:
    - path-pattern: /api/v1/auth/**
      capacity: 60
      refill-per-minute: 60
    - path-pattern: /api/v1/profiles/search
      capacity: 60
      refill-per-minute: 60
    - path-pattern: /api/v1/academies/search
      capacity: 60
      refill-per-minute: 60

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %highlight(%-5level) [%X{traceId:-no-trace}] [%15.15t] %-40.40logger{39} - %msg%n"
