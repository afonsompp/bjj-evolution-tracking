name: Release

# Deploys on a version tag (vX.Y.Z). Tests run as a gate BEFORE any deploy is
# triggered, and only the service that actually changed since the previous tag
# is deployed.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   RENDER_BACKEND_DEPLOY_HOOK   full Render Deploy Hook URL for the backend service
#   RENDER_FRONTEND_DEPLOY_HOOK  full Render Deploy Hook URL for the frontend service
# Each hook already contains "?key=..."; we append "&ref=<sha>" so Render deploys
# exactly the tagged commit. Turn OFF Render auto-deploy so tags are the only trigger.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # create the GitHub Release

jobs:
  # Decide which services changed since the previous version tag.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history + tags to diff against the previous one
      - id: diff
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "${PREV}" ]; then
            echo "No previous version tag found — deploying both services."
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Diffing ${PREV}...${GITHUB_REF_NAME}"
          CHANGED=$(git diff --name-only "${PREV}" "${GITHUB_REF_NAME}")
          echo "${CHANGED}"
          echo "backend=$(echo "${CHANGED}"  | grep -q '^backend/'  && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend=$(echo "${CHANGED}" | grep -q '^frontend/' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Test the backend, then deploy — only if it changed.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Test (gate)
        run: ./mvnw -B verify
      - name: Deploy to Render
        run: curl -fsS "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}&ref=${GITHUB_SHA}"

  # Type-check + build the frontend, then deploy — only if it changed.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type-check & build (gate)
        run: npm run build
      - name: Deploy to Render
        run: curl -fsS "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}&ref=${GITHUB_SHA}"

  # Cut a GitHub Release once the deploy(s) succeeded (skipped services are fine).
  release:
    needs: [changes, backend, frontend]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
