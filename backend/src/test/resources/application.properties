spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop

# Dummy storage config so the s3Client bean can instantiate in @SpringBootTest
# context loads (it only builds the client — no real connection is made).
storage.endpoint=http://localhost:9000
storage.region=us-east-1
storage.access-key=test
storage.secret-key=test
storage.bucket=test
storage.public-url-base=http://localhost:9000
